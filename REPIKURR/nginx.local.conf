server {
    listen 80;
    server_name _;

    # React SPA (проксируем в контейнер react-client)
    location / {
        proxy_pass http://react-client/;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # GeoServer
    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Список годов/районов (round23, задача 1) — round26, B4: маршрут
    # отсутствовал, из-за чего healthcheck.py на стенде не мог пройти
    # year_district_json/db_matches_static (запрос попадал в SPA-
    # catch-all и получал index.html вместо JSON). На проде тот же путь
    # уже был у Caddyfile (handle_path /static/*).
    location /static/ {
        alias /srv/static/;
        add_header Cache-Control "public, max-age=300";
    }
}
