version: '3.8'

services:
  # 1. База данных PostGIS
  db:
    image: postgis/postgis:15-3.3
    env_file: .env
    ports:
      - "5444:5432"  # Чтобы можно было подключиться из QGIS локально
    volumes:
      - ${HOST_PG_DATA}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. TensorFlow Serving — ОТКЛЮЧЕНО (раунд 7, prompts/PROMPT_onnx_inference_round7.md).
  # TensorFlow не поддерживает GPU Blackwell (RTX 5070 Ti, sm_120): готовые кернели
  # отсутствуют, JIT из PTX падает с CUDA_ERROR_INVALID_HANDLE / CUDA_ERROR_INVALID_PTX
  # на всех проверенных образах (2.19.0-gpu, 2.20.0-gpu). Подтверждённый апстрим-баг —
  # tensorflow/tensorflow#99592. Инференс переведён на ONNX Runtime (сервис etl ниже).
  # Сервис оставлен закомментированным как путь отката — исходные SavedModel не удалены,
  # лежат рядом с .onnx в ${HOST_MODEL_DIR}. Для отката: раскомментировать, вернуть
  # etl.depends_on: tf-serving и src/services/inference.py из _archive/inference_ovms_tfserving.py.
  # tf-serving:
  #   image: tensorflow/serving:2.19.0-gpu
  #   env_file: .env
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   ports:
  #     - "8500:8500" # gRPC
  #     - "8501:8501" # REST
  #   volumes:
  #     - ${HOST_MODEL_DIR}:/models
  #   command:
  #     - '--model_config_file=/models/models.config'
  #     - '--model_config_file_poll_wait_seconds=60'
  #     - '--per_process_gpu_memory_fraction=0.7'
  #     - '--enable_batching=true'
  #     - '--batching_parameters_file=/models/batching_parameters.txt'
  #     - '--num_batch_threads=4'
  #   healthcheck:
  #     test: ["CMD-SHELL", "nc -z localhost 8500"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  # 3. ETL Воркер (PIKURR) — инференс на ONNX Runtime + GPU напрямую в контейнере
  etl:
    build:
      context: ./PIKURR
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Монтируем входные данные (Read-Only)
      - ${HOST_INPUT_DIR}:${PATHS__DATA_INPUT}:ro
      # Монтируем выходные данные (Read-Write)
      - ${HOST_OUTPUT_DIR}:${PATHS__DATA_OUTPUT}
      # Модели (.onnx + исходные SavedModel как путь отката), read-only
      - ${HOST_MODEL_DIR}:/models:ro
      # SSH-ключ для rsync (Read-Only). Путь задаётся в .env через DELIVERY_SSH_KEY.
      - ${DELIVERY_SSH_KEY:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
    env_file:
      - .env  # Специальный env для докера
    ports:
      - "8505:8501"

